<style>
  :root {
    --font-heading: 'Fredoka', cursive, sans-serif;
    --font-body: 'Nunito', sans-serif;
  }
  
  body {
    font-family: var(--font-body);
    background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 40%, #fce7f3 70%, #fef3c7 100%);
    background-attachment: fixed;
    color: #2d3748;
    overflow-x: hidden;
  }

  h1, h2, h3, .font-heading {
    font-family: var(--font-heading);
  }

  /* Custom Floating Animations for Mascots */
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }

  @keyframes bounceCute {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px) scale(1.03); }
  }

  @keyframes earWiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(12deg); }
  }

  @keyframes wobbleWrong {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px) rotate(-3deg); }
    40%, 80% { transform: translateX(8px) rotate(3deg); }
  }

  @keyframes popSuccess {
    0% { transform: scale(0.9); opacity: 0.8; }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .anim-float { animation: floatSlow 4s ease-in-out infinite; }
  .anim-bounce { animation: bounceCute 2.5s ease-in-out infinite; }
  .anim-wiggle { animation: earWiggle 3s ease-in-out infinite; }
  .anim-tail { transform-origin: bottom center; animation: tailWag 1.8s ease-in-out infinite; }
  .anim-wobble { animation: wobbleWrong 0.5s ease-in-out; }
  .anim-pop { animation: popSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

  /* Cloud & Bubble Styling */
  .cloud-card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border: 4px solid #ffffff;
    box-shadow: 0 12px 32px -8px rgba(120, 100, 180, 0.15), 0 4px 12px rgba(0,0,0,0.05);

  .btn-bubble {
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 0px rgba(0,0,0,0.12);
  }
  .btn-bubble:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 9px 0px rgba(0,0,0,0.12);
  }
  .btn-bubble:active:not(:disabled) {
    transform: translateY(2px) scale(0.98);
    box-shadow: 0 3px 0px rgba(0,0,0,0.12);
  }

  #confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99;
  }

<script>
/* ==========================================================================
   WEB AUDIO API SYNTHESIZER MODULE
   ========================================================================== */
let audioCtx = null;
let isAudioMuted = false;
let bgmInterval = null;
let bgmStep = 0;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Background Music Chime Sequencer
const bgmNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 440.00, 349.23, 392.00, 523.25, 659.25, 523.25];
function startBGM() {
  if (bgmInterval || isAudioMuted) return;
  bgmInterval = setInterval(() => {
    if (isAudioMuted || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = bgmNotes[bgmStep % bgmNotes.length];
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.65);
      bgmStep++;
    } catch(e){}
  }, 750);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function toggleAudio() {
  initAudio();
  isAudioMuted = !isAudioMuted;
  const icon = document.getElementById('audio-icon');
  const text = document.getElementById('audio-text');
  const btn = document.getElementById('audio-toggle-btn');
  
  if (isAudioMuted) {
    stopBGM();
    icon.textContent = '🔇';
    text.textContent = 'Music OFF';
    btn.classList.replace('bg-amber-400', 'bg-gray-300');
  } else {
    startBGM();
    icon.textContent = '🎵';
    text.textContent = 'Music ON';
    btn.classList.replace('bg-gray-300', 'bg-amber-400');
    playClickSound();
  }
}

// Sound Effects Generators
function playClickSound() {
  if (isAudioMuted) return;
  initAudio();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.09);
  } catch(e){}
}

function playCorrectSound() {
  if (isAudioMuted) return;
  initAudio();
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
  notes.forEach((freq, idx) => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + (idx * 0.09);
      gain.gain.setValueAtTime(0.15, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.22);
    } catch(e){}
  });
}

function playWrongSound() {
  if (isAudioMuted) return;
  initAudio();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.26);
  } catch(e){}
}

function playFanfareSound() {
  if (isAudioMuted) return;
  initAudio();
  const arpeggio = [440, 554.37, 659.25, 880, 659.25, 880, 1108.73];
  arpeggio.forEach((freq, idx) => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + (idx * 0.1);
      gain.gain.setValueAtTime(0.18, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.28);
    } catch(e){}
  });
}

function playCoinsSound() {
  if (isAudioMuted) return;
  initAudio();
  try {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = 'sine';
    osc2.type = 'sine';
    osc1.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5
    osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08); // E6
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start();
    osc2.start(audioCtx.currentTime + 0.08);
    osc1.stop(audioCtx.currentTime + 0.3);
    osc2.stop(audioCtx.currentTime + 0.35);
  } catch(e){}
}

/* ==========================================================================
   CANVAS CONFETTI PARTICLE SYSTEM
   ========================================================================== */
const confettiCanvas = document.getElementById('confetti-canvas');
const ctx = confettiCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function launchConfetti() {
  particles = [];
  const colors = ['#f472b6', '#38bdf8', '#fbbf24', '#34d399', '#a78bfa', '#fb7185'];
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2 - 50,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.7) * 14,
      size: Math.random() * 9 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rSpeed: (Math.random() - 0.5) * 10
    });
  }
  requestAnimationFrame(updateConfetti);
}

function updateConfetti() {
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  let alive = false;
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.35; // Gravity
    p.rotation += p.rSpeed;
    if (p.y < confettiCanvas.height) alive = true;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  });
  if (alive) requestAnimationFrame(updateConfetti);
}

function save() {
  localStorage.setItem('fla-data', JSON.stringify(data));
  document.getElementById('points').textContent = data.points;
}

function go(page) {
  playClickSound();
  current = page;
  document.querySelectorAll('.navbtn').forEach(b => {
    const active = b.dataset.page === page;
    b.className = `navbtn btn-bubble font-extrabold px-4 py-2 rounded-xl text-sm sm:text-base ${
      active ? 'bg-purple-600 text-white' : 'bg-purple-100 hover:bg-purple-200 text-purple-800'
    }`;
  });
  render();
}

/* Modal Helper */
function showModal(title, msg, icon = '🎉', confirmCb = null) {
  const modal = document.getElementById('custom-modal');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal-icon').textContent = icon;
  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';

  if (confirmCb) {
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-bubble bg-gray-200 text-gray-800 font-extrabold px-5 py-2.5 rounded-2xl';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { playClickSound(); modal.classList.add('hidden'); };

    const okBtn = document.createElement('button');
    okBtn.className = 'btn-bubble bg-purple-600 text-white font-extrabold px-6 py-2.5 rounded-2xl';
    okBtn.textContent = 'Yes, Redeem!';
    okBtn.onclick = () => { playClickSound(); modal.classList.add('hidden'); confirmCb(); };

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
  } else {
    const okBtn = document.createElement('button');
    okBtn.className = 'btn-bubble bg-purple-600 text-white font-extrabold px-6 py-2.5 rounded-2xl';
    okBtn.textContent = 'Awesome!';
    okBtn.onclick = () => { playClickSound(); modal.classList.add('hidden'); };
    actions.appendChild(okBtn);
  }
  modal.classList.remove('hidden');
}

/* ==========================================================================
   VIEW RENDERERS
   ========================================================================== */
function render() {
  const app = document.getElementById('app');
  if (current === 'home') app.innerHTML = homeHTML();
  if (current === 'subject') app.innerHTML = subjectHTML();
  if (current === 'progress') app.innerHTML = progressHTML();
  if (current === 'shop') app.innerHTML = shopHTML();
  if (current === 'rewards') app.innerHTML = rewardsHTML();
  save();
}

}

        </button>

/* Choice Evaluation Handler */
function choose(answer) {
  if (answered) return;
  answered = true;
  let q = activeSubject.questions[qIndex];
  let ok = answer === q[1];
  const fb = document.getElementById('feedback');

  document.querySelectorAll('.answer-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === q[1]) {
      b.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'anim-pop');
    }
  });

  if (ok) {
    correct++;
    data.points += 5;
    playCorrectSound();
    playCoinsSound();
    fb.className = 'min-h-[50px] flex items-center justify-center font-black text-lg text-center rounded-2xl px-4 py-2 bg-emerald-100 text-emerald-900 border-2 border-emerald-300 anim-pop';
    fb.innerHTML = '🎉 Great job! You earned +5 stars! ⭐';
  } else {
    playWrongSound();
    fb.className = 'min-h-[50px] flex items-center justify-center font-black text-lg text-center rounded-2xl px-4 py-2 bg-amber-100 text-amber-900 border-2 border-amber-300 anim-wobble';
    fb.innerHTML = `💛 Good try! The correct answer is <strong>${q[1]}</strong>.`;
  }

  document.getElementById('next').style.display = 'inline-block';
  save();
}

function nextQuestion() {
  playClickSound();
  qIndex++;
  answered = false;
  render();
}

/* Quiz Finish Screen */
function finishHTML(s) {
  let bonus = correct === s.questions.length ? 20 : 0;
  let already = data.completed.includes(s.id);
  
  if (!window.finishHandled) {
    if (!already) {
      data.points += 10 + bonus;
      data.completed.push(s.id);
    }
    window.finishHandled = true;
    save();
    launchConfetti();
    playFanfareSound();
  }

  return `
    <div class="text-center py-6 space-y-6 anim-pop">
      <div class="w-32 h-32 mx-auto bg-amber-100 rounded-full p-2 border-4 border-amber-300">
        ${Mascots.Owl}

          You got <span class="text-purple-950 font-black text-xl">${correct}</span> out of <span class="text-purple-950 font-black text-xl">${s.questions.length}</span> questions right!
        </p>
      </div>

      <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 max-w-md mx-auto font-black text-amber-900 text-base">
        ${already ? '🌟 Lesson already completed! Great practice!' : `🎉 You earned ${10 + bonus} extra bonus stars!`}
        ${bonus ? '<br><span class="text-emerald-600 text-sm">✨ Includes Perfect Score Bonus! (+20)</span>' : ''}
      </div>

      <button onclick="window.finishHandled=false; go('home')" class="btn-bubble bg-purple-600 hover:bg-purple-700 text-white font-black text-lg px-8 py-3.5 rounded-2xl">
        Back to Subjects 🏠

  `;
}

/* Redeem Prize Logic */
function redeem(id) {
  let p = prizes.find(x => x.id === id);
  if (data.points < p.cost) {
    playWrongSound();
    showModal('Need More Stars!', 'Complete more activities and quizzes to earn enough stars for this prize!', '⭐');
    return;
  }

  showModal(
    'Redeem Prize?',
    `Would you like to spend ${p.cost} stars to unlock the ${p.name}?`,
    p.emoji,
    () => {
      data.points -= p.cost;
      data.redeemed.push({
        id: p.id,
        name: p.name,
        emoji: p.emoji,
        cost: p.cost,
        date: new Date().toLocaleDateString()
      });
      save();
      launchConfetti();
      playCoinsSound();
      playFanfareSound();
      render();
      showModal('Reward Redeemed! 🎉', `You unlocked the ${p.name}! Check it out in your Rewards Shelf.`, p.emoji);
    }
  );
}
